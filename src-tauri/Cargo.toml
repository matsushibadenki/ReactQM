[package]
name = "reactqm"
version = "0.1.0"
description = "ReactQM desktop foundation"
edition = "2021"
rust-version = "1.90"

[lib]
name = "reactqm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
wgpu = "27"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "CATransaction"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
dispatch2 = "0.3"

[dev-dependencies]
png = "0.18"
