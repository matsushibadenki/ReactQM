[package]
name = "reactqm"
version = "0.1.0"
description = "ReactQM desktop foundation"
edition = "2021"
rust-version = "1.90"

[lib]
name = "reactqm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
wgpu = "27"

[dev-dependencies]
pollster = "0.4"
